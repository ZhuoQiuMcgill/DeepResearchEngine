[project]
name = "deepresearch-engine"
version = "0.1.0"
description = "A modular execution platform for composable deep research workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "ddgs==9.16.0",
    "trafilatura==2.2.0",
    "pypdf==6.19.0",
    "jsonschema>=4.23,<5",
    "python-dotenv>=1,<2",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch", "src/ebd"]

[project.scripts]
deepresearch = "deepresearch.interfaces.cli.main:main"
ebd = "deepresearch.interfaces.cli.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
